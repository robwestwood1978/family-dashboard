name: Family Dashboard v0.4 Preview Manager
version: "0.4.0"
slug: family_dashboard_preview
description: Builds an isolated read-only v0.4 Family Dashboard preview without replacing v0.3.
url: https://github.com/robwestwood1978/family-dashboard/tree/preview/v0.4.0-private-path/family_dashboard_manager
arch:
  - aarch64
  - amd64
init: false
startup: application
boot: auto
stage: experimental
homeassistant: "2026.8.0"
homeassistant_api: true
map:
  - type: homeassistant_config
    read_only: false
    path: /config
options:
  snapshot_limit: 5
  tunnel_enabled: false
  tunnel_id: ""
  control_plane_api_key: ""
schema:
  snapshot_limit: int(1,20)
  tunnel_enabled: bool
  tunnel_id: str?
  control_plane_api_key: password?
backup: hot
