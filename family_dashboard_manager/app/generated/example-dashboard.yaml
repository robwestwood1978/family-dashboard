# Generated by @family-dashboard/manager. Do not edit by hand.
title: "Family Dashboard"
views:
  - title: "Today"
    path: today
    icon: mdi:home-heart
    type: sections
    max_columns: 4
    sections:
      - type: grid
        column_span: 3
        cards:
          - type: markdown
            content: "# {{ now().strftime('%A %d %B') }}"
          - type: "custom:daylight-calendar-card"
            title: "Coming up"
            entities:
              - "calendar.family"
            default_view: "agenda"
            first_day_of_week: 1
            locale: "en-GB"
            use_24hr_schedule: true
            event_styles:
              - match:
                  calendar: "calendar.family"
                style:
                  color: "#5B5BD6"
                  font_color: "#FFFFFF"
            rolling_days_agenda: 3
            agenda_compact_events: true
            hide_empty_days: true
            past_event_mode: hide
            compact_height: true
      - type: grid
        cards:
          - type: "custom:mediocre-multi-media-player-card"
            size: compact
            entity_id: "media_player.living_room"
            media_players:
              - entity_id: "media_player.living_room"
                name: "Living room"
                ma_entity_id: "media_player.living_room_music_assistant"
                can_be_grouped: true
            options:
              player_is_active_when: playing_or_paused
              show_volume_step_buttons: true
          - type: markdown
            title: "Chores"
            content: "ChoreOps entities will appear after live inventory mapping."
          - type: markdown
            title: "Football"
            content: "Premier League fixtures and results will appear after the data-source proof."
  - title: "Calendar"
    path: calendar
    icon: mdi:calendar-month
    type: panel
    cards:
      - type: "custom:daylight-calendar-card"
        title: "Family Dashboard"
        entities:
          - "calendar.family"
        default_view: "week-standard"
        first_day_of_week: 1
        locale: "en-GB"
        use_24hr_schedule: true
        event_styles:
          - match:
              calendar: "calendar.family"
            style:
              color: "#5B5BD6"
              font_color: "#FFFFFF"
  - title: "Home"
    path: home
    icon: mdi:home-automation
    type: sections
    max_columns: 4
    sections:
      - type: grid
        cards:
          - type: heading
            heading: "Living room"
            icon: mdi:sofa-outline
          - type: tile
            entity: "light.living_room"
            features_position: bottom
          - type: thermostat
            entity: "climate.living_room"
  - title: "Music"
    path: music
    icon: mdi:music-circle
    type: panel
    cards:
      - type: "custom:mediocre-multi-media-player-card"
        size: large
        mode: panel
        height: "calc(100vh - 96px)"
        entity_id: "media_player.living_room"
        media_players:
          - entity_id: "media_player.living_room"
            name: "Living room"
            ma_entity_id: "media_player.living_room_music_assistant"
            can_be_grouped: true
        options:
          player_is_active_when: playing_or_paused
          show_volume_step_buttons: true
          default_tab: massive
  - title: "Chores"
    path: chores
    icon: mdi:checkbox-marked-circle-auto-outline
    type: sections
    max_columns: 3
    sections:
      - type: grid
        cards:
          - type: markdown
            title: "Chores"
            content: "ChoreOps will be mapped after the live inventory connection."
  - title: "Football"
    path: football
    icon: mdi:soccer
    type: sections
    max_columns: 3
    sections:
      - type: grid
        cards:
          - type: markdown
            title: "Football"
            content: "Premier League fixtures and results will be connected after the data-source proof."
