  - title: "Chores"
    path: chores
    icon: mdi:checkbox-marked-circle-auto-outline
    type: sections
    max_columns: 2
    dense_section_placement: false
    sections:
      - type: grid
        background:
          color: "#F3F1EC"
          opacity: 100
        cards:
          - type: heading
            heading: "Child one's chores"
            icon: mdi:star-check-outline
            heading_style: title
          - type: custom:mushroom-template-card
            entity: "sensor.child_one_choreops_points"
            primary: "Child one"
            secondary: "{{ states('sensor.child_one_choreops_points') }} points · {{ state_attr('sensor.child_one_choreops_chores', 'chore_stat_current_due_today') | int(0) }} due today"
            icon: mdi:star-circle
            icon_color: "#E76F51"
            multiline_secondary: true
            tap_action:
              action: more-info
            card_mod:
              style: |
                ha-card {
                  --primary-color: #E76F51;
                  --accent-color: #E76F51;
                  --primary-text-color: #202432;
                  --secondary-text-color: #697080;
                  --state-icon-color: #E76F51;
                  --paper-item-icon-color: #E76F51;
                  background: #FFFFFF;
                  color: #202432;
                  border: 1px solid rgba(231, 111, 81, 0.2);
                  border-radius: 20px;
                  box-shadow: 0 6px 18px rgba(32, 36, 50, 0.08);
                }
                ha-card, ha-card * {
                  animation: none !important;
                  transition: none !important;
                }
          - type: custom:auto-entities
            card:
              type: grid
              columns: 1
              square: false
            card_param: cards
            filter:
              template: |-
                {%- set helper = 'sensor.child_one_choreops_ui_dashboard_helper' -%}
                {%- set helpers = state_attr(helper, 'dashboard_helpers') or {} -%}
                {%- set helper_entities = helpers.get('chore_helper_eids', []) if helpers is mapping else [] -%}
                {%- if helper_entities is string or helper_entities is not iterable -%}
                  {%- set helper_entities = [] -%}
                {%- endif -%}
                {%- set ns = namespace(chores=state_attr(helper, 'chores') | default([], true), visible=0) -%}
                {%- for helper_entity in helper_entities -%}
                  {%- set ns.chores = ns.chores + (state_attr(helper_entity, 'chores') | default([], true)) -%}
                {%- endfor -%}
                {%- for chore in ns.chores -%}
                  {%- set chore_entity = chore.eid if chore is mapping else chore -%}
                  {%- set raw_state = states(chore_entity) -%}
                  {%- if chore_entity not in [none, '', 'unknown'] and raw_state not in ['completed', 'approved', 'already_approved', 'completed_by_other'] -%}
                    {%- set chore_name = state_attr(chore_entity, 'chore_name') | default(state_attr(chore_entity, 'friendly_name') or chore_entity, true) -%}
                    {%- set chore_icon = state_attr(chore_entity, 'icon') | default('mdi:broom', true) -%}
                    {%- set claim_button = state_attr(chore_entity, 'claim_button_eid') | default('', true) -%}
                    {%- set approve_button = state_attr(chore_entity, 'approve_button_eid') | default('', true) -%}
                    {%- set disapprove_button = state_attr(chore_entity, 'disapprove_button_eid') | default('', true) -%}
                    {%- set active_button = (disapprove_button or approve_button) if raw_state == 'claimed' else (claim_button or approve_button) -%}
                    {%- set tile_colour = 'red' if raw_state in ['overdue', 'missed'] else 'orange' if raw_state == 'due' else 'purple' if raw_state == 'claimed' else 'primary' -%}
                    {{ {
                      'type': 'tile',
                      'entity': chore_entity,
                      'name': chore_name,
                      'icon': chore_icon,
                      'color': tile_colour,
                      'vertical': false,
                      'state_content': ['state', 'due_date'],
                      'tap_action': {
                        'action': 'perform-action',
                        'perform_action': 'button.press',
                        'target': {'entity_id': active_button}
                      } if active_button not in ['', none] else {'action': 'none'},
                      'hold_action': {'action': 'more-info', 'entity': chore_entity}
                    } }},
                    {%- set ns.visible = ns.visible + 1 -%}
                  {%- endif -%}
                {%- endfor -%}
                {%- if ns.visible == 0 -%}
                  {{ {'type': 'markdown', 'content': '**All caught up.** Nothing needs attention right now.'} }}
                {%- endif -%}
            card_mod:
              style: |
                ha-card {
                  --primary-color: #E76F51;
                  --accent-color: #E76F51;
                  --primary-text-color: #202432;
                  --secondary-text-color: #697080;
                  --state-icon-color: #E76F51;
                  --paper-item-icon-color: #E76F51;
                  background: #FFFFFF;
                  color: #202432;
                  border: 1px solid rgba(231, 111, 81, 0.2);
                  border-radius: 20px;
                  box-shadow: 0 6px 18px rgba(32, 36, 50, 0.08);
                }
                ha-card, ha-card * {
                  animation: none !important;
                  transition: none !important;
                }
