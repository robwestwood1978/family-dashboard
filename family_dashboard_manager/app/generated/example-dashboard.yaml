# Generated by @family-dashboard/manager v0.2.0. Do not edit by hand.
title: "Family Dashboard"
kiosk_mode:
  non_admin_settings:
    kiosk: true
    block_context_menu: false
  admin_settings:
    kiosk: false
views:
  - title: "Today"
    path: today
    icon: mdi:home-heart
    type: sections
    max_columns: 3
    dense_section_placement: false
    sections:
      - type: grid
        column_span: 3
        background:
          color: "#5B5BD6"
          opacity: 100
        cards:
          - type: markdown
            content: |-
              # {{ now().strftime('%A') }}
              ## {{ now().strftime('%d %B %Y') }}
            card_mod:
              style: |
                ha-card {
                  --primary-color: #5B5BD6;
                  --accent-color: #5B5BD6;
                  --primary-text-color: #FFFFFF;
                  --secondary-text-color: #FFFFFF;
                  --state-icon-color: #FFFFFF;
                  --paper-item-icon-color: #FFFFFF;
                  background: #5B5BD6;
                  color: #FFFFFF;
                  border: 1px solid rgba(91, 91, 214, 0.2);
                  border-radius: 20px;
                  box-shadow: 0 6px 18px rgba(32, 36, 50, 0.08);
                }
                ha-card, ha-card * {
                  animation: none !important;
                  transition: none !important;
                }
      - type: grid
        column_span: 2
        background:
          color: "#F3F1EC"
          opacity: 100
        cards:
          - type: "custom:daylight-calendar-card"
            title: "Coming up"
            entities:
              - "calendar.family"
            default_view: "agenda"
            first_day_of_week: 1
            locale: "en-GB"
            use_24hr_schedule: true
            color_scheme: light
            header_color: "#5B5BD6"
            hide_dark_mode_toggle: true
            enable_event_management: false
            event_calendar_friendly_name: true
            background_transparent: false
            header_background_transparent: false
            header_weather_sensor: "weather.home"
            event_styles:
              - match:
                  calendar: "calendar.family"
                style:
                  color: "#5B5BD6"
                  font_color: "#FFFFFF"
            rolling_days_agenda: 3
            agenda_compact_events: true
            hide_empty_days: true
            past_event_mode: hide
            compact_header: true
            card_mod:
              style: |
                ha-card {
                  --primary-color: #5B5BD6;
                  --accent-color: #5B5BD6;
                  --primary-text-color: #202432;
                  --secondary-text-color: #697080;
                  --state-icon-color: #5B5BD6;
                  --paper-item-icon-color: #5B5BD6;
                  background: #FFFFFF;
                  color: #202432;
                  border: 1px solid rgba(91, 91, 214, 0.2);
                  border-radius: 20px;
                  box-shadow: 0 6px 18px rgba(32, 36, 50, 0.08);
                }
